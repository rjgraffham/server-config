apiVersion: apps/v1
kind: Deployment
metadata:
  name: silverbullet
  namespace: silverbullet
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: silverbullet
  template:
    metadata:
      labels:
        app: silverbullet
    spec:
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: silverbullet-data-claim
      securityContext:
        runAsUser: 3678
        runAsGroup: 3678
      containers:
      - name: app
        image: ghcr.io/silverbulletmd/silverbullet:latest@sha256:02e9d68a240cda0d5f3ea08b81fad9fe84aff629d91ff4145230fdaea37cab6c
        volumeMounts:
        - name: data
          mountPath: /data
        ports:
        - containerPort: 3000
