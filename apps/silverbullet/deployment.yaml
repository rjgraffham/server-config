apiVersion: apps/v1
kind: Deployment
metadata:
  name: silverbullet
  namespace: silverbullet
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: silverbullet
  template:
    metadata:
      labels:
        app: silverbullet
    spec:
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: silverbullet-data-claim
      securityContext:
        runAsUser: 3678
        runAsGroup: 3678
      containers:
      - name: app
        image: ghcr.io/silverbulletmd/silverbullet:latest@sha256:c6604f0daef79a842bbee366abb843f88723c4b0504549078da56778a9d854b4
        volumeMounts:
        - name: data
          mountPath: /data
        ports:
        - containerPort: 3000
