apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-ingress
  namespace: silverbullet
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - notes.psquid.net
    secretName: silverbullet-tls
  rules:
  - host: notes.psquid.net
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: web
            port:
              number: 80
