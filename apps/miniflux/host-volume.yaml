apiVersion: v1
kind: PersistentVolume
metadata:
  name: miniflux-data
spec:
  hostPath:
    path: /var/lib/cluster-data/miniflux
    type: DirectoryOrCreate
  accessModes:
  - ReadWriteOnce
  capacity:
    storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: miniflux-data-claim
  namespace: default
spec:
  storageClassName: ""
  volumeName: miniflux-data
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
