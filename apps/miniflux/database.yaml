apiVersion: v1
kind: PersistentVolume
metadata:
  name: miniflux-postgres
spec:
  hostPath:
    path: /var/lib/cluster-data/cnpg/miniflux
    type: DirectoryOrCreate
  accessModes:
  - ReadWriteOnce
  capacity:
    storage: 5Gi
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: miniflux-postgres
  namespace: default
spec:
  instances: 1
  enablePDB: false  # if cluster grows to >1 node, ensure this becomes true to do proper switchover on drain
  bootstrap:
    initdb:
      database: miniflux
      owner: miniflux
      secret:
        name: miniflux-postgres
  imageCatalogRef:
    apiGroup: postgresql.cnpg.io
    kind: ClusterImageCatalog
    name: postgresql-standard-trixie
    major: 18
  storage:
    size: 5Gi
    pvcTemplate:
      storageClassName: ""
      volumeName: miniflux-postgres
      accessModes:
      - ReadWriteOnce
