apiVersion: apps/v1
kind: Deployment
metadata:
  name: miniflux
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: miniflux
  template:
    metadata:
      labels:
        app: miniflux
    spec:
      securityContext:
        runAsUser: 8080
        runAsGroup: 8080
      containers:
      - name: app
        image: ghcr.io/miniflux/miniflux:latest@sha256:72e49f513a63104506aab98ba8cfc3a409d4fde23550a583dec07ec941f1e94e
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: miniflux
              key: DATABASE_URL
        envFrom:
        - configMapRef:
            name: miniflux
        ports:
        - containerPort: 8080
        startupProbe:
          httpGet:
            path: /readiness
            port: 8080
          failureThreshold: 12  # 12 * 10s = 2 minutes startup leeway
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /readiness
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 30
