apiVersion: apps/v1
kind: Deployment
metadata:
  name: miniflux
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: miniflux
  template:
    metadata:
      labels:
        app: miniflux
    spec:
      securityContext:
        runAsUser: 8080
        runAsGroup: 8080
      containers:
      - name: app
        image: ghcr.io/miniflux/miniflux:latest@sha256:8fd6c3c434ecc3d4083306f83e03c0bb74c632e0f8378da5ead7e1773b0b89c9
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: miniflux-postgres
              key: connection_url
        envFrom:
        - configMapRef:
            name: miniflux
        ports:
        - containerPort: 8080
        startupProbe:
          httpGet:
            path: /readiness
            port: 8080
          failureThreshold: 12  # 12 * 10s = 2 minutes startup leeway
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /readiness
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 30
