apiVersion: apps/v1
kind: Deployment
metadata:
  name: tsidp
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tsidp
  template:
    metadata:
      labels:
        app: tsidp
    spec:
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: tsidp-data-claim
      securityContext:
        runAsUser: 4240
        runAsGroup: 4240
      containers:
      - name: app
        image: ghcr.io/tailscale/tsidp:latest@sha256:7a30d56cb1a33fd72ea44b12ab3659b5c7a8a3afe3cf4ada76a700f19b96185b
        env:
        - name: TAILSCALE_USE_WIP_CODE
          value: "1"
        - name: TS_STATE_DIR
          value: /data
        - name: TS_HOSTNAME
          value: idp
        - name: TSIDP_ENABLE_STS
          value: "1"
        - name: TSIDP_USE_FUNNEL
          value: "1"
        - name: TS_ADVERTISE_TAGS
          value: "tag:tsidp"
        - name: TS_AUTHKEY
          valueFrom:
            secretKeyRef:
              name: tsidp
              key: TS_AUTHKEY
        volumeMounts:
        - name: data
          mountPath: /data
