apiVersion: apps/v1
kind: Deployment
metadata:
  name: tsidp
  namespace: default
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tsidp
  template:
    metadata:
      labels:
        app: tsidp
    spec:
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: tsidp-data-claim
      securityContext:
        runAsUser: 4240
        runAsGroup: 4240
      containers:
      - name: app
        image: ghcr.io/tailscale/tsidp:latest@sha256:809c3a9c8258c0feabc1b344d0dc2a19ead2df1ea9606796b8f65cd22161cadc
        env:
        - name: TAILSCALE_USE_WIP_CODE
          value: "1"
        - name: TS_STATE_DIR
          value: /data
        - name: TS_HOSTNAME
          value: idp
        - name: TSIDP_ENABLE_STS
          value: "1"
        - name: TSIDP_USE_FUNNEL
          value: "1"
        - name: TS_ADVERTISE_TAGS
          value: "tag:tsidp"
        - name: TS_AUTHKEY
          valueFrom:
            secretKeyRef:
              name: tsidp
              key: TS_AUTHKEY
        volumeMounts:
        - name: data
          mountPath: /data
