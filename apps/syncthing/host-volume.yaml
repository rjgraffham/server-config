apiVersion: v1
kind: PersistentVolume
metadata:
  name: syncthing-data
spec:
  hostPath:
    path: /var/lib/cluster-data/syncthing
    type: DirectoryOrCreate
  accessModes:
  - ReadWriteOnce
  capacity:
    storage: 60Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: syncthing-data-claim
  namespace: default
spec:
  storageClassName: ""
  volumeName: syncthing-data
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 60Gi
