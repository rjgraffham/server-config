apiVersion: apps/v1
kind: Deployment
metadata:
  name: syncthing
  namespace: default
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: syncthing
  template:
    metadata:
      labels:
        app: syncthing
    spec:
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: syncthing-data-claim
      securityContext:
        runAsUser: 4838
        runAsGroup: 3354
      containers:
      - name: app
        image: syncthing/syncthing:2@sha256:2b71da7c0d0a91a6ae5285ad079226fecc0a365d08b27720e1f7037b018f7546
        volumeMounts:
        - name: data
          mountPath: /var/syncthing/config
          subPath: config
        - name: data
          mountPath: /Sync
          subPath: data
        ports:
        - containerPort: 8384
        startupProbe:
          httpGet:
            path: /rest/noauth/health
            port: 8384
          failureThreshold: 30  # 30 * 10s = 5 minutes startup leeway
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /rest/noauth/health
            port: 8384
          initialDelaySeconds: 10
          periodSeconds: 30
