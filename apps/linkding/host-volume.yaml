apiVersion: v1
kind: PersistentVolume
metadata:
  name: linkding-data
spec:
  hostPath:
    path: /var/lib/cluster-data/linkding
    type: DirectoryOrCreate
  accessModes:
  - ReadWriteOnce
  capacity:
    storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: linkding-data-claim
  namespace: default
spec:
  storageClassName: ""
  volumeName: linkding-data
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
