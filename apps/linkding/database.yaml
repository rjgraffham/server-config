apiVersion: v1
kind: PersistentVolume
metadata:
  name: linkding-postgres
spec:
  hostPath:
    path: /var/lib/cluster-data/cnpg/linkding
    type: DirectoryOrCreate
  accessModes:
  - ReadWriteOnce
  capacity:
    storage: 5Gi
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: linkding-postgres
  namespace: default
spec:
  instances: 1
  bootstrap:
    initdb:
      database: linkding
      owner: linkding
      secret:
        name: linkding-postgres
  imageCatalogRef:
    apiGroup: postgresql.cnpg.io
    kind: ClusterImageCatalog
    name: postgresql-standard-trixie
    major: 18
  storage:
    size: 5Gi
    pvcTemplate:
      storageClassName: ""
      volumeName: linkding-postgres
      accessModes:
      - ReadWriteOnce
