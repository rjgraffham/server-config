apiVersion: apps/v1
kind: Deployment
metadata:
  name: ereadifier
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ereadifier
  template:
    metadata:
      labels:
        app: ereadifier
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      containers:
      - name: ereadifier
        image: ghcr.io/rjgraffham/ereadifier:latest@sha256:d7727db488d0f6b5c9aaad6f67bf8e2b16127a3b29bd3d5780de7e7ae0d5b545
        env:
        - name: EREADIFIER_DIMENSIONS
          value: clara
        - name: EREADIFIER_ENCODE
          value: smallest
        - name: EREADIFIER_LOSSY_QUALITY
          value: "85"
        - name: EREADIFIER_DOUBLE_PAGE
          value: wider
        - name: EREADIFIER_LISTEN
          value: 0.0.0.0:5656
        ports:
        - containerPort: 5656
