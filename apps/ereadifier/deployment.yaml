apiVersion: apps/v1
kind: Deployment
metadata:
  name: ereadifier
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ereadifier
  template:
    metadata:
      labels:
        app: ereadifier
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      containers:
      - name: ereadifier
        image: ghcr.io/rjgraffham/ereadifier:latest@sha256:05811d3b61ed2f3eecccb4e269912c9d2540d1b0ba674b7010f79c4fee6c0b85
        env:
        - name: EREADIFIER_DIMENSIONS
          value: clara
        - name: EREADIFIER_ENCODE
          value: smallest
        - name: EREADIFIER_LOSSY_QUALITY
          value: "85"
        - name: EREADIFIER_DOUBLE_PAGE
          value: wider
        - name: EREADIFIER_LISTEN
          value: 0.0.0.0:5656
        ports:
        - containerPort: 5656
