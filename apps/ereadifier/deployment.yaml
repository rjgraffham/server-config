apiVersion: apps/v1
kind: Deployment
metadata:
  name: ereadifier
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ereadifier
  template:
    metadata:
      labels:
        app: ereadifier
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      containers:
      - name: ereadifier
        image: ghcr.io/rjgraffham/ereadifier:latest@sha256:b52d1c9ad03aa24465686b078a6fd1f842194eaf7e7d0b9fd2075f3149c0038c
        env:
        - name: EREADIFIER_DIMENSIONS
          value: clara
        - name: EREADIFIER_ENCODE
          value: smallest
        - name: EREADIFIER_LOSSY_QUALITY
          value: "85"
        - name: EREADIFIER_DOUBLE_PAGE
          value: wider
        - name: EREADIFIER_LISTEN
          value: 0.0.0.0:5656
        ports:
        - containerPort: 5656
