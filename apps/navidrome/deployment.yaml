apiVersion: apps/v1
kind: Deployment
metadata:
  name: navidrome
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: navidrome
  template:
    metadata:
      labels:
        app: navidrome
    spec:
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: navidrome-data-claim
      - name: syncthing
        persistentVolumeClaim:
          claimName: syncthing-data-claim
      securityContext:
        runAsUser: 3354
        runAsGroup: 3354
      containers:
      - name: app
        image: deluan/navidrome:latest@sha256:38dc2727bfcfd5ede290f8ada114fc90368146f265ae4701ddddbcbe2a44ee52
        env:
        - name: ND_JELLYFIN_ENABLED
          value: "true"
        volumeMounts:
        - name: data
          mountPath: /data
        - name: syncthing
          mountPath: /music
          subPath: data/Music
          readOnly: true
        ports:
        - containerPort: 4533
