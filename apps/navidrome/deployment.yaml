apiVersion: apps/v1
kind: Deployment
metadata:
  name: navidrome
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: navidrome
  template:
    metadata:
      labels:
        app: navidrome
    spec:
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: navidrome-data-claim
      - name: syncthing
        persistentVolumeClaim:
          claimName: syncthing-data-claim
      securityContext:
        runAsUser: 3354
        runAsGroup: 3354
      containers:
      - name: app
        image: deluan/navidrome:latest@sha256:a384948b81bd1529986c5960169e7fc4fa00f46bde6bd517971a4c36671db2af
        volumeMounts:
        - name: data
          mountPath: /data
        - name: syncthing
          mountPath: /music
          subPath: data/Music
          readOnly: true
        ports:
        - containerPort: 4533
