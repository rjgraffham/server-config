apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-red
  namespace: node-red
spec:
  replicas: 1
  selector:
    matchLabels:
      app: node-red
  template:
    metadata:
      labels:
        app: node-red
    spec:
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: node-red-data-claim
      securityContext:
        runAsUser: 1880
        runAsGroup: 1880
      containers:
      - name: app
        image: nodered/node-red:5@sha256:3622786c15b6f57f61bf1d0ece59d06a18b742c5c8955f588d189b6bee8dc97d
        volumeMounts:
        - name: data
          mountPath: /data
        ports:
        - containerPort: 1880
