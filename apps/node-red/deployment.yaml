apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-red
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: node-red
  template:
    metadata:
      labels:
        app: node-red
    spec:
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: node-red-data-claim
      securityContext:
        runAsUser: 1880
        runAsGroup: 1880
      containers:
      - name: app
        image: nodered/node-red:5@sha256:0ed181c867c9ef19cf51dc4707f7fb54d1ad58a0227ab4e19732f6a3630c1b00
        volumeMounts:
        - name: data
          mountPath: /data
        ports:
        - containerPort: 1880
