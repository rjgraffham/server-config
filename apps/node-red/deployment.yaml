apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-red
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: node-red
  template:
    metadata:
      labels:
        app: node-red
    spec:
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: node-red-data-claim
      securityContext:
        runAsUser: 1880
        runAsGroup: 1880
      containers:
      - name: app
        image: nodered/node-red:5@sha256:2ccd38b4066648bd5e17430c50a2f8102c566a82fd4f2fc5c342e61664d6896f
        volumeMounts:
        - name: data
          mountPath: /data
        ports:
        - containerPort: 1880
