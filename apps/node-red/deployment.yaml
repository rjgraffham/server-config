apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-red
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: node-red
  template:
    metadata:
      labels:
        app: node-red
    spec:
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: node-red-data-claim
      securityContext:
        runAsUser: 1880
        runAsGroup: 1880
      containers:
      - name: app
        image: nodered/node-red:5@sha256:e085d4a06591fd0aca2ea2a91364d27f1a0e31e885675f77935e10f95412a963
        volumeMounts:
        - name: data
          mountPath: /data
        ports:
        - containerPort: 1880
