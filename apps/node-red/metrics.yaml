apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: home-metrics
  namespace: node-red
spec:
  dependsOn:
  - apiVersion: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: vmstaticscrapes.operator.victoriametrics.com
  resources:
  - apiVersion: operator.victoriametrics.com/v1beta1
    kind: VMStaticScrape
    metadata:
      name: home-metrics
      namespace: node-red
    spec:
      jobName: "homemetrics"
      targetEndpoints:
      - targets:
        - "web.node-red:80"
        path: /home-metrics

