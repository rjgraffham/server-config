apiVersion: v1
kind: PersistentVolume
metadata:
  name: node-red-data
spec:
  hostPath:
    path: /var/lib/cluster-data/node-red
    type: DirectoryOrCreate
  accessModes:
  - ReadWriteOnce
  capacity:
    storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: node-red-data-claim
  namespace: default
spec:
  storageClassName: ""
  volumeName: node-red-data
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
