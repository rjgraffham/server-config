apiVersion: v1
kind: PersistentVolume
metadata:
  name: audiobookshelf-data
spec:
  hostPath:
    path: /var/lib/cluster-data/audiobookshelf
    type: DirectoryOrCreate
  accessModes:
  - ReadWriteOnce
  capacity:
    storage: 15Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: audiobookshelf-data-claim
  namespace: default
spec:
  storageClassName: ""
  volumeName: audiobookshelf-data
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 15Gi
