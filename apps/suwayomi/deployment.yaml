apiVersion: apps/v1
kind: Deployment
metadata:
  name: suwayomi
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: suwayomi
  template:
    metadata:
      labels:
        app: suwayomi
    spec:
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: suwayomi-data-claim
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      containers:
      - name: app
        image: ghcr.io/suwayomi/suwayomi-server:preview@sha256:b45e91fb40a8c31b1204ed8d98e64669ed64ed2374920f272b9ff68bd066edf7
        env:
        - name: TZ
          value: "Etc/UTC"
        volumeMounts:
        - name: data
          mountPath: /home/suwayomi/.local/share/Tachidesk
        ports:
        - containerPort: 4567
