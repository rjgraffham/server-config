apiVersion: apps/v1
kind: Deployment
metadata:
  name: suwayomi
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: suwayomi
  template:
    metadata:
      labels:
        app: suwayomi
    spec:
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: suwayomi-data-claim
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      containers:
      - name: app
        image: ghcr.io/suwayomi/suwayomi-server:preview@sha256:9c6fd13530b3b279bd421fd4adad5a65f692468d1fd7f08b72e4478bf1e7e75f
        env:
        - name: TZ
          value: "Etc/UTC"
        volumeMounts:
        - name: data
          mountPath: /home/suwayomi/.local/share/Tachidesk
        ports:
        - containerPort: 4567
      - name: ereadifier
        image: ghcr.io/rjgraffham/ereadifier:latest@sha256:d620fb58551cdd7c537d52c362c4dbb4cd2550f3a4a0039e4f9d367c2b18d8b3
        env:
        - name: EREADIFIER_DIMENSIONS
          value: clara
        - name: EREADIFIER_ENCODE
          value: smallest
        - name: EREADIFIER_LOSSY_QUALITY
          value: "85"
        - name: EREADIFIER_DOUBLE_PAGE
          value: wider
        - name: EREADIFIER_LISTEN
          value: 127.0.0.1:5656
