apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: suwayomi
  namespace: suwayomi
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - yomi.psquid.net
    secretName: suwayomi-tls
  rules:
  - host: yomi.psquid.net
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: web
            port:
              number: 80
