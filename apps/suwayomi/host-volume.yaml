apiVersion: v1
kind: PersistentVolume
metadata:
  name: suwayomi-data
spec:
  hostPath:
    path: /var/lib/cluster-data/suwayomi
    type: DirectoryOrCreate
  accessModes:
  - ReadWriteOnce
  capacity:
    storage: 50Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: suwayomi-data-claim
  namespace: default
spec:
  storageClassName: ""
  volumeName: suwayomi-data
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
