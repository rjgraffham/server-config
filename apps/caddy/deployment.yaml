apiVersion: apps/v1
kind: Deployment
metadata:
  name: caddy
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: caddy
  template:
    metadata:
      labels:
        app: caddy
    spec:
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: caddy-data-claim
      - name: caddyfile
        configMap:
          name: caddyfile
      securityContext:
        runAsUser: 4146
        runAsGroup: 4146
      containers:
      - name: app
        image: caddy:2@sha256:bfbff8b17bbd229b0255dbd33173646339e5afd4b0920f5e0fecbb6ee6d6c4dd
        ports:
        - containerPort: 80
        volumeMounts:
        - name: data
          mountPath: /config
          subPath: config
        - name: data
          mountPath: /data
          subPath: data
        - name: data
          mountPath: /srv/sites
          subPath: sites
          readOnly: true
        - name: caddyfile
          mountPath: /etc/caddy
          readOnly: true
