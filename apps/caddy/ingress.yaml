apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-ingress
  namespace: caddy
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - "*.psquid.net"
    - psquid.net
    secretName: caddy-tls
  rules:
  - host: "*.psquid.net"
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: web
            port:
              number: 80
  - host: psquid.net
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: web
            port:
              number: 80
