apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: forgejo
spec:
  type: ClusterIP
  selector:
    app: forgejo
  ports:
  - port: 80
    targetPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: git-ssh
  namespace: forgejo
spec:
  type: ClusterIP
  selector:
    app: forgejo
  ports:
  - port: 2222
    targetPort: 2222
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: forgejo
spec:
  type: ClusterIP
  selector:
    app: forgejo-redis
  ports:
  - port: 6379
    targetPort: 6379
