apiVersion: v1
kind: Service
metadata:
  name: forgejo-web
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: forgejo
  ports:
  - port: 80
    targetPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: forgejo-ssh
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: forgejo
  ports:
  - port: 2222
    targetPort: 2222
