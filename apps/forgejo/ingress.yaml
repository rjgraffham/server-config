apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  namespace: forgejo
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - git.psquid.net
    secretName: forgejo-tls
  rules:
  - host: git.psquid.net
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: web
            port:
              number: 80
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: git-ssh
  namespace: forgejo
spec:
  ingressClassName: traefik
  entryPoints:
  - git
  routes:
  - match: 'HostSNI(`*`)'
    services:
    - name: git-ssh
      port: 2222
