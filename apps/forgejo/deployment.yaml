apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo
  namespace: forgejo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: forgejo
  template:
    metadata:
      labels:
        app: forgejo
    spec:
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: forgejo-data-claim
      containers:
      - name: app
        image: codeberg.org/forgejo/forgejo:17@sha256:879f4f10a98e3e167b32cde5f7ae3af0163d50bfacf567559a27a0e95a95670c
        env:
        - name: USER_UID
          value: "1000"
        - name: USER_GID
          value: "1000"
        - name: TZ
          value: "Europe/London"
        - name: FORGEJO__database__DB_TYPE
          value: postgres
        - name: FORGEJO__database__HOST
          value: "postgres-rw.forgejo.svc.cluster.local:5432"
        - name: FORGEJO__database__NAME
          value: forgejo
        - name: FORGEJO__database__USER
          valueFrom:
            secretKeyRef:
              name: forgejo-postgres
              key: username
        - name: FORGEJO__database__PASSWD
          valueFrom:
            secretKeyRef:
              name: forgejo-postgres
              key: password
        - name: FORGEJO__session__PROVIDER
          value: redis
        - name: FORGEJO__session__PROVIDER_CONFIG
          value: "redis://redis.forgejo.svc.cluster.local:6379/1"
        - name: FORGEJO__cache__ADAPTER
          value: redis
        - name: FORGEJO__cache__HOST
          value: "redis://redis.forgejo.svc.cluster.local:6379/2"
        - name: FORGEJO__cache__ITEM_TTL
          value: "16h"
        - name: FORGEJO__queue__TYPE
          value: redis
        - name: FORGEJO__queue__CONN_STR
          value: "redis://redis.forgejo.svc.cluster.local:6379/3"
        volumeMounts:
        - name: data
          mountPath: /data
          subPath: data
        ports:
        - containerPort: 2222
        - containerPort: 3000
        startupProbe:
          httpGet:
            path: /api/healthz
            port: 3000
          failureThreshold: 12  # 12 * 10s = 2 minutes startup leeway
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/healthz
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 30
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo-redis
  namespace: forgejo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: forgejo-redis
  template:
    metadata:
      labels:
        app: forgejo-redis
    spec:
      containers:
      - name: redis
        image: valkey/valkey:9@sha256:169567d6288e5f08aa141847c0c3e0864a32e727682ca6f052a20567c7103ef8
