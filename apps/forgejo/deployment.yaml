apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: forgejo
  template:
    metadata:
      labels:
        app: forgejo
    spec:
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: forgejo-data-claim
      containers:
      - name: app
        image: codeberg.org/forgejo/forgejo:17@sha256:fcd19ff4ebc85fb098a67e8e1d0d5a84d07dd6e8a23edcfdfd5b71a6178953be
        env:
        - name: USER_UID
          value: "1000"
        - name: USER_GID
          value: "1000"
        - name: TZ
          value: "Europe/London"
        - name: FORGEJO__database__DB_TYPE
          value: postgres
        - name: FORGEJO__database__HOST
          value: "forgejo-postgres-rw:5432"
        - name: FORGEJO__database__NAME
          value: forgejo
        - name: FORGEJO__database__USER
          valueFrom:
            secretKeyRef:
              name: forgejo-postgres
              key: username
        - name: FORGEJO__database__PASSWD
          valueFrom:
            secretKeyRef:
              name: forgejo-postgres
              key: password
        - name: FORGEJO__session__PROVIDER
          value: redis
        - name: FORGEJO__session__PROVIDER_CONFIG
          value: "redis://localhost:6379/1"
        - name: FORGEJO__cache__ADAPTER
          value: redis
        - name: FORGEJO__cache__HOST
          value: "redis://localhost:6379/2"
        - name: FORGEJO__cache__ITEM_TTL
          value: "16h"
        - name: FORGEJO__queue__TYPE
          value: redis
        - name: FORGEJO__queue__CONN_STR
          value: "redis://localhost:6379/3"
        volumeMounts:
        - name: data
          mountPath: /data
          subPath: data
        ports:
        - containerPort: 30022
        - containerPort: 3000
        startupProbe:
          httpGet:
            path: /api/healthz
            port: 3000
          failureThreshold: 12  # 12 * 10s = 2 minutes startup leeway
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/healthz
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 30
      - name: redis
        image: valkey/valkey:9@sha256:3add1a336a920ea54770a001ab6feb3da5fceea96a40373a3a2cd469b815f0b7
