apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: apps
  namespace: flux-system
spec:
  dependsOn:
  - apiVersion: source.toolkit.fluxcd.io/v1
    kind: GitRepository
    name: cluster-config
    namespace: flux-system
    ready: true
  resources:
  - apiVersion: kustomize.toolkit.fluxcd.io/v1
    kind: Kustomization
    metadata:
      name: apps
      namespace: flux-system
    spec:
      interval: 10m
      prune: true
      sourceRef:
        apiVersion: source.toolkit.fluxcd.io/v1
        kind: GitRepository
        name: cluster-config
        namespace: flux-system
      path: ./apps
