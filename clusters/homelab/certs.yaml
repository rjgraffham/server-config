apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: certs
  namespace: flux-system
spec:
  dependsOn:
  - apiVersion: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: certificaterequests.cert-manager.io
    ready: true
  - apiVersion: fluxcd.controlplane.io/v1
    kind: ResourceSet
    name: cert-manager
    namespace: flux-system
    ready: true
  - apiVersion: source.toolkit.fluxcd.io/v1
    kind: GitRepository
    name: cluster-config
    namespace: flux-system
    ready: true
  resources:
  - apiVersion: kustomize.toolkit.fluxcd.io/v1
    kind: Kustomization
    metadata:
      name: certs
      namespace: flux-system
    spec:
      interval: 10m
      prune: true
      sourceRef:
        apiVersion: source.toolkit.fluxcd.io/v1
        kind: GitRepository
        name: cluster-config
        namespace: flux-system
      path: ./certs
