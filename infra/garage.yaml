apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: garage
  namespace: flux-system
spec:
  resources:
   - apiVersion: source.toolkit.fluxcd.io/v1
     kind: GitRepository
     metadata:
      name: garage
      namespace: flux-system
     spec:
      interval: 1h
      url: https://git.deuxfleurs.fr/Deuxfleurs/garage.git
      ref:
        branch: main-v2
   - apiVersion: helm.toolkit.fluxcd.io/v2
     kind: HelmRelease
     metadata:
        name: garage
        namespace: flux-system
     spec:
      interval: 10m
      releaseName: garage
      targetNamespace: garage
      install:
        createNamespace: true
      chart:
        spec:
          chart: ./script/helm/garage
          sourceRef:
            kind: GitRepository
            name: garage
            namespace: flux-system
      values:
        garage:
          dbEngine: sqlite  # per docs, as we prefer durability over performance
          singleNode: true
          s3:
            api:
              region: "garage"
              rootDomain: ".garage.garage.svc.cluster.local"
            web:
              rootDomain: ".garage.garage.svc.cluster.local"
        persistence:
          enabled: true
          meta:
            size: 10Gi
            hostPath: /var/lib/cluster-data/garage/meta
          data:
            size: 25Gi
            hostPath: /var/lib/cluster-data/garage/data
        deployment:
          kind: DaemonSet  # 1 instance per node, necessary for persistence.*.hostPath
        image:
          repository: dxflrs/garage
        podSecurityContext:
          runAsUser: 1194
          runAsGroup: 1194
          fsGroup: 1194
