apiVersion: v1
kind: ConfigMap
metadata:
  name: ddclient-config
  namespace: default
data:
  ddclient.conf: |
    # Update every 5 minutes
    daemon=300
    
    # Get IP from web
    use=web
    
    # Update domain psquid.net (DNS managed by cloudflare)
    protocol=cloudflare
    zone=psquid.net
    login_env=CLOUDFLARE_LOGIN
    password_env=CLOUDFLARE_TOKEN
    psquid.net,*.psquid.net
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ddclient
  namespace: default
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ddclient
  template:
    metadata:
      labels:
        app: ddclient
    spec:
      volumes:
      - name: config
        configMap:
          name: ddclient-config
      containers:
      - name: app
        image: ghcr.io/rjgraffham/ddclient-k8s:latest@sha256:f71aa92e2b6cb98ac5f3e59f220e9ed7423af41660e6ac97b8d918446513c5ee
        envFrom:
        - secretRef:
            name: cloudflare-psquid-net
        volumeMounts:
        - name: config
          mountPath: /config
