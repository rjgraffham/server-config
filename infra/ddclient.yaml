apiVersion: v1
kind: ConfigMap
metadata:
  name: ddclient-config
  namespace: default
data:
  ddclient.conf: |
    # Update every 5 minutes
    daemon=300
    
    # Get IP from web
    use=web
    web=ipify-ipv4
    
    # Update domain psquid.net (DNS managed by cloudflare)
    protocol=cloudflare
    zone=psquid.net
    login=token
    password_env=CLOUDFLARE_TOKEN
    psquid.net,*.psquid.net
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ddclient
  namespace: default
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ddclient
  template:
    metadata:
      labels:
        app: ddclient
    spec:
      volumes:
      - name: config
        configMap:
          name: ddclient-config
      containers:
      - name: app
        image: ghcr.io/rjgraffham/ddclient-k8s:latest@sha256:a50f16d682093aca453b3f34b07213b488e9e5092679eba6396980f5abc224cb
        envFrom:
        - secretRef:
            name: cloudflare-psquid-net
        volumeMounts:
        - name: config
          mountPath: /config
