apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: vm-instance
  namespace: vm
spec:
  dependsOn:
  - apiVersion: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: vmsingles.operator.victoriametrics.com
  - apiVersion: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: vmagents.operator.victoriametrics.com
  resources:
  - apiVersion: v1
    kind: PersistentVolume
    metadata:
      name: vm-data
    spec:
      hostPath:
        path: /var/lib/cluster-data/victoria-metrics
        type: DirectoryOrCreate
      accessModes:
      - ReadWriteOnce
      capacity:
        storage: 15Gi
  - apiVersion: operator.victoriametrics.com/v1beta1
    kind: VMSingle
    metadata:
      name: vm-instance
      namespace: vm
    spec:
      configMaps:
      - dashboards
      extraArgs:
        vmui.customDashboardsPath: /etc/vm/configs/dashboards
      retentionPeriod: "14d"
      removePvcAfterDelete: true
      storage:
        storageClassName: ""
        volumeName: vm-data
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: 15Gi
      resources:
        requests:
          memory: 500Mi
          cpu: 500m
        limits:
          memory: 4Gi
          cpu: 2
  - apiVersion: operator.victoriametrics.com/v1beta1
    kind: VMAgent
    metadata:
      name: cluster-metrics
      namespace: vm
    spec:
      replicaCount: 1
      selectAllByDefault: true
      remoteWrite:
        - url: http://vmsingle-vm-instance.vm.svc.cluster.local:8428/api/v1/write
