apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboards
  namespace: vm
data:
  index.js: |-
    window.__VMUI_PREDEFINED_DASHBOARDS__ = [
      "node-resources.json",
      "pod-resources.json",
    ];
  node-resources.json: |-
    {
      "title": "per-node resource usage",
      "rows": [
        {
          "panels": [
            {
              "title": "Per-node CPU usage",
              "unit": "cores",
              "width": 6,
              "alias": ["{{node}}"],
              "expr": ["sum(rate(container_cpu_usage_seconds_total{container!=\"\"}[5m])) by (node)"]
            },
            {
              "title": "Per-node memory usage",
              "unit": "MiB",
              "width": 6,
              "alias": ["{{node}}"],
              "expr": ["sum(container_memory_usage_bytes{container!=\"\"} / (1024 * 1024)) by (node)"]
            },
            {
              "title": "Per-node disk read",
              "unit": "MiB",
              "width": 6,
              "alias": ["{{node}}"],
              "expr": ["sum(rate(container_fs_reads_bytes_total{container!=\"\"}[5m] / (1024 * 1024))) by (node)"]
            },
            {
              "title": "Per-node disk write",
              "unit": "MiB",
              "width": 6,
              "alias": ["{{node}}"],
              "expr": ["sum(rate(container_fs_writes_bytes_total{container!=\"\"}[5m] / (1024 * 1024))) by (node)"]
            }
          ]
        }
      ]
    }
  pod-resources.json: |-
    {
      "title": "per-pod resource usage",
      "rows": [
        {
          "panels": [
            {
              "title": "Per-pod CPU usage (top 20)",
              "unit": "cores",
              "width": 6,
              "alias": ["{{namespace}}/{{pod}}"],
              "expr": ["topk_avg(20, sum(rate(container_cpu_usage_seconds_total{container!=\"\"}[5m])) by (namespace,pod))"]
            },
            {
              "title": "Per-pod memory usage (top 20)",
              "unit": "MiB",
              "width": 6,
              "alias": ["{{namespace}}/{{pod}}"],
              "expr": ["topk_avg(20, sum(container_memory_usage_bytes{container!=\"\"} / (1024 * 1024)) by (namespace,pod))"]
            },
            {
              "title": "Per-pod disk read (top 20)",
              "unit": "MiB",
              "width": 6,
              "alias": ["{{namespace}}/{{pod}}"],
              "expr": ["topk_avg(20, sum(rate(container_fs_reads_bytes_total{container!=\"\"}[5m] / (1024 * 1024))) by (namespace, pod))"]
            },
            {
              "title": "Per-pod disk write (top 20)",
              "unit": "MiB",
              "width": 6,
              "alias": ["{{namespace}}/{{pod}}"],
              "expr": ["topk_avg(20, sum(rate(container_fs_writes_bytes_total{container!=\"\"}[5m] / (1024 * 1024))) by (namespace, pod))"]
            }
          ]
        }
      ]
    }
