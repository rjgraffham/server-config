apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup
  namespace: default
spec:
  schedule: "0 */6 * * *"
  replicas: 1
  jobTemplate:
    spec:
      template:
        spec:
          volumes:
          - name: data
            persistentVolumeClaim:
              claimName: backup-data-claim
          - name: secrets
            secret:
              secretName: backup-ssh
              defaultMode: 0600
          containers:
          - name: runner
            image: ghcr.io/rjgraffham/backup-runner:latest@sha256:83c73cbc3e32ddfb804b087f2d35ced4744bfc513de5465e219bec68e33eba9e
            volumeMounts:
            - name: data
              mountPath: /data
              readOnly: true
            - name: secrets
              mountPath: /secrets
              readOnly: true
          restartPolicy: OnFailure
