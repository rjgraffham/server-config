apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup
  namespace: default
spec:
  schedule: "0 */6 * * *"
  replicas: 1
  jobTemplate:
    spec:
      template:
        spec:
          volumes:
          - name: data
            persistentVolumeClaim:
              claimName: backup-data-claim
          - name: secrets
            secret:
              secretName: backup-ssh
              defaultMode: 0600
          containers:
          - name: runner
            image: ghcr.io/rjgraffham/backup-runner:latest@sha256:d94c0d6a2c35597a2dc13752857607d699b328edf0a219cdb08569d0c5838fd4
            volumeMounts:
            - name: data
              mountPath: /data
              readOnly: true
            - name: secrets
              mountPath: /secrets
              readOnly: true
          restartPolicy: OnFailure
