apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup
  namespace: default
spec:
  schedule: "0 */6 * * *"
  replicas: 1
  jobTemplate:
    spec:
      template:
        spec:
          volumes:
          - name: data
            persistentVolumeClaim:
              claimName: backup-data-claim
          - name: secrets
            secret:
              secretName: backup-ssh
              defaultMode: 0600
          containers:
          - name: runner
            image: ghcr.io/rjgraffham/backup-runner:latest@sha256:5363552a2c7c9574bcbe2af43fc6da7562f9eaec22f0d1526cc1a6faf29fafd8
            volumeMounts:
            - name: data
              mountPath: /data
              readOnly: true
            - name: secrets
              mountPath: /secrets
              readOnly: true
          restartPolicy: OnFailure
