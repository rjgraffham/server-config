apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup
  namespace: default
spec:
  schedule: "0 */6 * * *"
  replicas: 1
  jobTemplate:
    spec:
      template:
        spec:
          volumes:
          - name: data
            persistentVolumeClaim:
              claimName: backup-data-claim
          - name: secrets
            secret:
              secretName: backup-ssh
              defaultMode: 0600
          containers:
          - name: runner
            image: ghcr.io/rjgraffham/backup-runner:latest@sha256:29aac15298095781247441cef5abc7a0bb75de088dd6845fe8d5f86a5d3c7394
            volumeMounts:
            - name: data
              mountPath: /data
              readOnly: true
            - name: secrets
              mountPath: /secrets
              readOnly: true
          restartPolicy: OnFailure
