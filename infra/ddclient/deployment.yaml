apiVersion: apps/v1
kind: Deployment
metadata:
  name: ddclient
  namespace: ddclient
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ddclient
  template:
    metadata:
      labels:
        app: ddclient
    spec:
      volumes:
      - name: config
        configMap:
          name: ddclient-config
      containers:
      - name: app
        image: ghcr.io/rjgraffham/ddclient-k8s:latest@sha256:c2666ee419528ac9637e2ad20ccdc5107f240f08bb583f8c927f97904f941f41
        envFrom:
        - secretRef:
            name: cloudflare-psquid-net
        volumeMounts:
        - name: config
          mountPath: /config
